<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fire Login System</title>

    <!-- CSS CONNECTION -->
    <link rel="stylesheet" href="Login_style.css">

    <!-- JAVASCRIPT CONNECTION -->
    <script src="script.js" defer></script>
</head>

<body>

<div class="form-container">

    <h2 id="formTitle">🔥 Login</h2>

    <form id="authForm">

        <label for="username">Username</label>
        <input type="text" id="username"
               placeholder="Enter username" required>

        <label for="password">Password</label>
        <input type="password" id="password"
               placeholder="Enter password" required>

        <div class="show-password" id="showPasswordContainer">
            <input type="checkbox" id="showPassword"
                   onclick="togglePasswordVisibility()">
            <label for="showPassword">Show Password</label>
        </div>

        <label for="confirmPassword"
               id="confirmPasswordLabel" style="display:none;">
            Confirm Password
        </label>

        <input type="password" id="confirmPassword"
               placeholder="Confirm password"
               style="display:none;">

        <p id="passwordMatchMessage"
           style="font-size:14px; display:none;"></p>

        <button type="submit" id="submitButton">
            Login
        </button>

        <p id="errorMessage"></p>

        <p id="toggleText">
            Don't have an account?
            <a href="#" onclick="toggleForm(); return false;">
                Sign Up
            </a>
        </p>

    </form>

</div>

</body>
</html>
